# Windows clean-checkout build gate (P1-12 compatibility matrix).
#
# The hosted Windows runner has no Vulkan device, so this job stops after a
# successful MinGW configure + compile (`-SkipTests`). The numerical gates
# (43 CTest cases, upstream parity, the forced math-probe fallback) run on a
# real RTX machine before each release; this job only proves that a clean
# checkout of the Windows engine builds from the checked-in sources with an
# independently provisioned MinGW toolchain (MSYS2, not the maintainer's
# E:\deepseekHerness\SpektraLab-src\deps copy).
#
# The desktop app is deliberately excluded: it needs Rust/cargo, Node/npm and
# the Tauri bundler, all covered by the local release checklist in
# RELEASES.md instead of a 10 GB hosted toolchain.

name: Windows build

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: MinGW toolchain and Vulkan build inputs
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-glslang
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader

      - name: LibRaw 0.22.2 (official release + ARW6 overlay)
        shell: pwsh
        run: engine/setup-libraw.ps1 -DependencyDirectory ..\deps

      - name: Configure and build the engine
        env:
          SPEKTRALAB_CI_NO_OPENMP: '1'
        # The build script is PowerShell, but the MinGW prefix is only on PATH
        # inside an msys2 shell step. Resolve Windows paths there and hand them
        # to pwsh explicitly (cygpath -m keeps forward slashes, which
        # PowerShell accepts).
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "msys2 root: $(cygpath -w /)"
          echo "gcc: $(command -v gcc)  cmake: $(command -v cmake)"
          test -f /mingw64/include/vulkan/vulkan.h || {
            echo "Vulkan headers missing; /mingw64/include contains:" >&2
            ls -la /mingw64/include | head -40 >&2
            exit 1
          }
          vulkan=/mingw64/bin/vulkan-1.dll
          if [ ! -f "$vulkan" ]; then vulkan=/mingw64/bin/libvulkan-1.dll; fi
          glslang=/mingw64/bin/glslangValidator.exe
          if [ ! -f "$glslang" ]; then glslang=/mingw64/bin/glslang.exe; fi
          echo "vulkan loader: $vulkan"
          echo "glslang: $glslang"
          PS="/c/Program Files/PowerShell/7/pwsh.exe"
          if [ ! -x "$PS" ]; then PS=powershell.exe; fi
          "$PS" -NoProfile -File engine/build-windows.ps1 \
            -BuildDirectory build/windows \
            -Fresh -SkipTests -Jobs 4 \
            '-Desktop:$false' \
            '-LibRawSourceDirectory' '..\deps\LibRaw-0.22.2' \
            -VulkanIncludeDirectory "$(cygpath -m /mingw64/include)" \
            -VulkanLibrary "$(cygpath -m "$vulkan")" \
            -GlslangExecutable "$(cygpath -m "$glslang")"
            '-ExtraConfigureArguments' '-DSPEKTRALAB_LIBRAW_OPENMP=OFF'

      - name: Upload the build manifest
        uses: actions/upload-artifact@v4
        with:
          name: windows-toolchain-manifest
          path: build/windows/toolchain.json
          if-no-files-found: error
