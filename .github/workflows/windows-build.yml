# Windows clean-checkout build gate (P1-12 compatibility matrix).
#
# The hosted Windows runner has no Vulkan device, so this job stops after a
# successful MinGW configure + compile (`-SkipTests`). The numerical gates
# (43 CTest cases, upstream parity, the forced math-probe fallback) run on a
# real RTX machine before each release; this job only proves that a clean
# checkout of the Windows engine builds from the checked-in sources with an
# independently provisioned MinGW toolchain (MSYS2, not the maintainer's
# E:\deepseekHerness\SpektraLab-src\deps copy).
#
# The desktop app is deliberately excluded: it needs Rust/cargo, Node/npm and
# the Tauri bundler, all covered by the local release checklist in
# RELEASES.md instead of a 10 GB hosted toolchain.

name: Windows build

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: MinGW toolchain and Vulkan build inputs
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-glslang
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader

      - name: LibRaw 0.22.2 (official release + ARW6 overlay)
        shell: pwsh
        run: engine/setup-libraw.ps1 -DependencyDirectory ..\deps

      - name: Locate the MSYS2 toolchain
        shell: pwsh
        run: |
          # setup-msys2 with cache: true extracts the cached image into the
          # checkout as msys64\, so the prefix is workspace-relative on the
          # hosted runner even though a local install would live in C:\msys64.
          $roots = @((Join-Path $env:GITHUB_WORKSPACE 'msys64'), 'C:\msys64')
          $root = $roots | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ 'mingw64\include\vulkan\vulkan.h')
          } | Select-Object -First 1
          if (-not $root) {
            foreach ($candidate in $roots) {
              Write-Host "candidate: $candidate exists=$(Test-Path -LiteralPath $candidate)"
              if (Test-Path -LiteralPath $candidate) {
                Get-ChildItem -LiteralPath $candidate -Force |
                  Select-Object -First 6 | ForEach-Object { Write-Host "  $($_.Name)" }
              }
            }
            Get-ChildItem -LiteralPath 'C:\msys64' -Force -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  C:\\\\msys64\\\\$($_.Name)" }
            Get-ChildItem -LiteralPath 'C:\msys64\mingw64' -Force -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  C:\\\\msys64\\\\mingw64\\\\$($_.Name)" }
            Get-ChildItem -LiteralPath 'C:\msys64' -Recurse -Filter vulkan.h -ErrorAction SilentlyContinue |
              Select-Object -First 5 | ForEach-Object { Write-Host "  found: $($_.FullName)" }
            & where.exe gcc 2>$null | ForEach-Object { Write-Host "  gcc: $_" }
            throw 'MSYS2 mingw64 prefix with Vulkan headers was not found.'
          }
          $mingw = Join-Path $root 'mingw64'
          $vulkan = @(
            (Join-Path $mingw 'bin\vulkan-1.dll'),
            (Join-Path $mingw 'bin\libvulkan-1.dll'),
            (Join-Path $env:WINDIR 'System32\vulkan-1.dll')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $vulkan) { throw 'Vulkan loader DLL was not found.' }
          $glslang = @(
            (Join-Path $mingw 'bin\glslangValidator.exe'),
            (Join-Path $mingw 'bin\glslang.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $glslang) { throw 'glslangValidator was not found.' }
          Add-Content -Path $env:GITHUB_ENV -Value "MSYS_ROOT=$root"
          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_INCLUDE=$(Join-Path $mingw 'include')"
          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_LOADER=$vulkan"
          Add-Content -Path $env:GITHUB_ENV -Value "GLSLANG_EXE=$glslang"
          Write-Host "MSYS_ROOT=$root"
          Write-Host "VULKAN_LOADER=$vulkan"
          Write-Host "GLSLANG_EXE=$glslang"

      - name: Configure and build the engine
        shell: pwsh
        run: |
          $mingw = Join-Path $env:MSYS_ROOT 'mingw64'
          $env:PATH = "$mingw\bin;$env:PATH"
          engine/build-windows.ps1 `
            -BuildDirectory build/windows `
            -Fresh -SkipTests -Jobs 4 -Desktop:$false `
            -LibRawSourceDirectory ..\deps\LibRaw-0.22.2 `
            -VulkanIncludeDirectory $env:VULKAN_INCLUDE `
            -VulkanLibrary $env:VULKAN_LOADER `
            -GlslangExecutable $env:GLSLANG_EXE

      - name: Upload the build manifest
        uses: actions/upload-artifact@v4
        with:
          name: windows-toolchain-manifest
          path: build/windows/toolchain.json
          if-no-files-found: error
